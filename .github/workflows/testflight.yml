name: TestFlight

# Run by hand from the Actions tab. Needs, in the repository settings:
#
#   Variables: APPLE_TEAM_ID             the 10-character Team ID
#   Secrets:   ASC_KEY_ID                App Store Connect API key ID
#              ASC_ISSUER_ID             App Store Connect issuer ID
#              ASC_PRIVATE_KEY           contents of the AuthKey_XXXX.p8 file
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the repository settings"
              missing=1
            fi
          done
          [ -z "$missing" ]

      # The runner context is not available in job-level env.
      - name: Set paths
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Memo.xcarchive" >> "$GITHUB_ENV"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      # Signed for development here and re-signed for distribution at export.
      # Xcode creates the certificate and profiles through the API key; the
      # development profile needs at least one device registered on the team.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Memo.xcodeproj \
            -scheme Memo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Sign for distribution
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Show the distribution signature
        run: |
          ls -la "$RUNNER_TEMP/export"
          unzip -q "$RUNNER_TEMP/export"/*.ipa -d "$RUNNER_TEMP/ipa"
          app=$(echo "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -dvvv --entitlements - "$app" 2>&1 | grep -v '^Hash\|^CDHash\|^CandidateCDHash'
          codesign --verify --strict --verbose=2 "$app"
          security cms -D -i "$app/embedded.mobileprovision" | grep -A1 -E '<key>(Name|ExpirationDate|TeamName)</key>'

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/"AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export"/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys
