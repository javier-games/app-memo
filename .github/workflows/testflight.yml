name: TestFlight

# Run by hand from the Actions tab. Needs, in the repository settings:
#
#   Variables: APPLE_TEAM_ID                  the 10-character Team ID
#   Secrets:   ASC_KEY_ID                     App Store Connect API key ID
#              ASC_ISSUER_ID                  App Store Connect issuer ID
#              ASC_PRIVATE_KEY                contents of the AuthKey_XXXX.p8 file
#              SIGNING_CERTIFICATE_P12        the Apple Distribution certificate
#                                             and its key, as base64 of a .p12
#              SIGNING_CERTIFICATE_PASSWORD   the password of that .p12
#
# The certificate lasts a year. When it expires, make a new one from a new
# certificate request and replace the two SIGNING_ secrets.
#
# `destination: device` makes an ad hoc build for one registered iPhone instead,
# pointed at CloudKit's development database. Running it once after a change to
# the data model is what creates the new fields there, which a Mac-less setup
# has no other way to do.
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Where the build goes
        type: choice
        options: [testflight, device]
        default: testflight
      device_udid:
        description: UDID of the iPhone (device builds only)
        type: string
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DESTINATION: ${{ inputs.destination }}
      DEVICE_UDID: ${{ inputs.device_udid }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY \
              SIGNING_CERTIFICATE_P12 SIGNING_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the repository settings"
              missing=1
            fi
          done
          if [ "$DESTINATION" = device ] && [ -z "$DEVICE_UDID" ]; then
            echo "::error::A device build needs the device_udid input"
            missing=1
          fi
          [ -z "$missing" ]

      # The runner context is not available in job-level env.
      - name: Set paths
        run: |
          password=$(uuidgen)
          echo "::add-mask::$password"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Memo.xcarchive"
            echo "SIGNING_DIR=$RUNNER_TEMP/signing"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db"
            echo "KEYCHAIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"

      # Built unsigned; the app is signed by hand below.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Memo.xcodeproj \
            -scheme Memo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create a keychain
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

      - name: Import the signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security import "$certificate" -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # Lets the profile be made for exactly this certificate.
          serial=$(openssl pkcs12 -in "$certificate" -nokeys \
              -passin env:SIGNING_CERTIFICATE_PASSWORD 2>/dev/null \
            | openssl x509 -noout -serial | cut -d= -f2)
          echo "SIGNING_CERT_SERIAL=$serial" >> "$GITHUB_ENV"
          rm -f "$certificate"

      - name: Create the profile
        run: fastlane create_profile

      # Signed with codesign rather than xcodebuild -exportArchive. Xcode
      # writes the certificate's common name into the designated requirement in
      # decomposed Unicode, which does not match the precomposed "í" in the
      # certificate, and App Store Connect rejects the result as an invalid
      # signature (error 90035). The requirement here names the team instead.
      - name: Sign and package
        run: |
          app="$ARCHIVE_PATH/Products/Applications/Memo.app"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk 'NR==1 {print $2}')

          # The app's own entitlements plus the ones every distribution build
          # carries. Push is always production outside Xcode; the CloudKit
          # database depends on where the build is going.
          entitlements="$RUNNER_TEMP/Distribution.entitlements"
          cp Memo/Memo.entitlements "$entitlements"
          if [ "$DESTINATION" = device ]; then
            cloudkit=Development
          else
            cloudkit=Production
            /usr/libexec/PlistBuddy -c "Add :beta-reports-active bool true" "$entitlements"
          fi
          /usr/libexec/PlistBuddy \
            -c "Set :aps-environment production" \
            -c "Add :com.apple.developer.icloud-container-environment string $cloudkit" \
            -c "Add :application-identifier string $APPLE_TEAM_ID.games.javier.memo" \
            -c "Add :com.apple.developer.team-identifier string $APPLE_TEAM_ID" \
            -c "Add :get-task-allow bool false" \
            "$entitlements"

          # A profile only carries what the App ID has switched on. Signing
          # with more than that produces a build App Store Connect rejects.
          if ! security cms -D -i "$SIGNING_DIR/Memo.mobileprovision" \
              | grep -q "com.apple.developer.icloud-services"; then
            echo "::error::The App ID games.javier.memo does not have iCloud enabled in the developer portal."
            exit 1
          fi

          cp "$SIGNING_DIR/Memo.mobileprovision" "$app/embedded.mobileprovision"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign "$identity" --keychain "$KEYCHAIN_PATH" {} \;
          fi
          codesign --force --sign "$identity" --keychain "$KEYCHAIN_PATH" \
            --entitlements "$entitlements" \
            --generate-entitlement-der \
            -r="designated => anchor apple generic and identifier \"games.javier.memo\" and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\" and certificate 1[field.1.2.840.113635.100.6.2.1] exists" \
            "$app"
          codesign --verify --strict --verbose=2 "$app"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Memo.ipa" Payload)

      - name: Upload to TestFlight
        if: inputs.destination != 'device'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/"AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/Memo.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the device build
        if: inputs.destination == 'device'
        uses: actions/upload-artifact@v4
        with:
          name: Memo-device
          path: ${{ runner.temp }}/Memo.ipa
          retention-days: 1

      # A device build keeps its profile: the build on the phone was made
      # with it, and the next device build replaces it anyway.
      - name: Remove the profile
        if: always() && inputs.destination != 'device'
        run: fastlane remove_profile

      - name: Remove key material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$ASC_KEY_PATH" "$SIGNING_DIR" ~/.appstoreconnect/private_keys
