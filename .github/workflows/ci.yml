name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # Simulator names change with every Xcode release, so pick whichever
      # iPhone the runner image ships instead of hardcoding one.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("SimRuntime.iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))]
            | last | .udid // empty')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # UI tests are left out: they are slow on hosted runners and need no
      # signing changes to run locally.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Memo.xcodeproj \
            -scheme Memo \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:MemoTests \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ${{ runner.temp }}/TestResults.xcresult
